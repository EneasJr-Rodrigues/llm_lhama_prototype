version: '3.8'

services:
  ray-local:
    build: .
    container_name: ray-local-test
    command: ray start --head --port=6379 --dashboard-host=0.0.0.0 --block
    shm_size: '8gb' # 8GB de RAM compartilhada é suficiente para testes locais
    ports:
      - "8000:8000"
      - "8501:8501"
      - "8080:8080"
    volumes:
      - /mnt/e/WSL/llm_cache:/app/model_cache
      - ./logs:/app/logs
      - ./system_prompt.txt:/app/system_prompt.txt
    env_file:
      - .env
    environment:
      - LLM_MODEL=${LLM_MODEL}
      - HF_TOKEN=${HF_TOKEN}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
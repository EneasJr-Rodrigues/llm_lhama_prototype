version: '3.8'

services:
  ray-worker:
    build: .
    container_name: ray-worker-node
    # O Worker não usa --head. Ele se conecta ao IP que o bash exportou.
    command: ray start --address='${HEAD_NODE_IP}:6379' --block
    network_mode: "host" 
    shm_size: '16gb' 
    environment:
      - LLM_MODEL=${LLM_MODEL}
      - HF_TOKEN=${HF_TOKEN}
    env_file:
      - .env
    volumes:
      - ./model_cache:/app/model_cache
      - ./logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
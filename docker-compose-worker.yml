version: '3.8'

services:
  ray-worker:
    build: .
    container_name: ray-worker-node
    # O Worker não usa --head. Ele se conecta ao IP que o bash exportou.
    command: ray start --address='${HEAD_NODE_IP}:6379' --block
    network_mode: "host" 
    shm_size: '16gb' 
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - MODEL_NAME=meta-llama/Meta-Llama-3.1-8B-Instruct
    volumes:
      - ./model_cache:/app/model_cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
version: '3.8'

services:
  ray-head:
    build: .
    container_name: ray-head-node
    command: ray start --head --port=6379 --dashboard-host=0.0.0.0 --block
    network_mode: "host"
    shm_size: '16gb'
    environment:
      - LLM_MODEL=${LLM_MODEL}
      - HF_TOKEN=${HF_TOKEN}
    env_file:
      - .env               # <-- Adicione esta linha!
    volumes:
      - ./model_cache:/app/model_cache
      - ./logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
version: '3.8'

services:
  ray-head:
    build: .
    container_name: ray-head-node
    command: ray start --head --port=6379 --dashboard-host=0.0.0.0 --block
    network_mode: "host"
    shm_size: '16gb'
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - MODEL_NAME=meta-llama/Meta-Llama-3.1-8B-Instruct
    volumes:
      - ./model_cache:/app/model_cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]